# SoftAE default configuration
# Copy this file and adjust values for your lab setup.

# The default board for GUI open and headless campaigns; its electrode count also
# seeds the Live BO board-exchange capacity. Must stay ABOVE the first [section]
# header: `loader.default_pcb_name()` reads a top-level key, and a bare key below a
# header belongs to that table. Names no known board -> first board alphabetically.
default_pcb = "SoftAE_EIS_4Stripe"

[paths]
thorlabs_dll = 'C:\Program Files\Thorlabs\Scientific Imaging\Scientific Camera Support\Scientific Camera Interfaces\SDK\Python Toolkit\dlls\64_lib'
palmsens_sdk = ''
data_root    = './data'

# --- Project-scoped data directory ---
[data]
project_dir   = "~/softae_data"   # expands ~; overridable per-project
db_filename   = "softae.db"       # SQLite file inside project_dir/db/
auto_save_eis = true              # auto-save EIS data to project data dir

[instruments.stage]
driver   = "stage"
port     = "ASRL7::INSTR"
baud     = 921_600
velocity = 10.0           # mm/s default
x_min    = -100.0         # mm travel limit
x_max    = 100.0
y_min    = -50.0
y_max    = 50.0
# Comms / timeout tuning (ESP301 manual §3.1–3.2).
visa_timeout_ms   = 8000      # PyVISA read timeout (driver default is ~2000)
write_termination = "\r"      # ESP301 commands terminate with CR (ASCII 13)
read_termination  = "\r"      # robust for CR- or CRLF-terminated replies
flow_control      = "none"    # "rts_cts" for a true RS-232C hardware handshake
query_delay       = 0.0       # seconds between write and read on a query

[instruments.syringe]
driver       = "syringe"
port         = "ASRL4::INSTR"
baud         = 115_200
diameter     = 14.4            # mm syringe inner diameter
head_channel = "Dev1/port0/line0:7"
max_rate     = 2120.0          # µL/min
min_rate     = 0.05            # µL/min
parallel_syringes = 2
parallel_syringes_pump0 = 2
parallel_syringes_pump1 = 1
parallel_syringes_pump2 = 2

[instruments.temp_controller]
driver   = "temp_controller"
port     = "com6"
baud     = 115_200
address  = 1
reg_sp   = 0               # Novus setpoint register
reg_pv   = 1               # Novus process-variable register
max_temp = 200.0            # °C safety ceiling
min_temp = 5.0              # °C safety floor

[instruments.pico1]
driver   = "espico"
name     = "Pico1"
port     = "COM9"  # auto-detect via PalmSens SDK

[instruments.pico2]
driver   = "espico"
name     = "Pico2"
port     = "COM5"

[instruments.camera]
driver   = "camera"
exposure = 0.045           # seconds

# ── DAC-switched loads (Adafruit MCP4728, I²C via MCP2221) ──────────────────
# Each [instruments.<key>] with driver = "dac_switch" maps to one MCP4728
# channel; add sections here for future channel-B/C/D loads. "lamp" is an alias —
# the factory accepts both "lamp" and "dac_switch".
[instruments.lamp]
driver   = "dac_switch"
channel  = "A"             # MCP4728 channel A–D
address  = "0x60"          # MCP4728 I²C address (default)
v_psu    = 5.0             # supply / full-scale voltage
on_volt  = 0.0             # active-low relay: 0 V = ON
off_volt = 5.0             # relay passive at full scale (5 V = OFF)

[instruments.keithley]
driver   = "keithley"
address  = "USB0::0x05E6::0x6510::04614885::INSTR"
nplc     = 1.0

[instruments.ht_sensor]
driver                 = "ht_sensor"
env_var                = "BLINKA_MCP2221"  # must be set to "1"
read_retries           = 3      # per-call retry attempts on transient I2C errors
read_retry_delay_s     = 0.05   # seconds between retries
reset_on_unrecoverable = true   # issue soft-reset on "Unrecoverable" errors

[instruments.rh_controller]
driver      = "rh_controller"
trinket_port = "COM11"
trinket_baud = 115_200
# The PID gains are part of the EIS calibration's hardware_hash material: editing
# one silently drops the stored mux16 calibration until it is re-derived.
pid_kp   = 0.007    # 0.007 original
pid_ki   = 0.0015    # 0.0015 original
pid_kd   = 0.035     # 0.05 original

# Consecutive I2C read errors before the RH driver power-cycles the HT sensor.
# NOT a campaign limit: the autonomous loop's park-on-systematic-fault limit is
# `AutonomousLoop.park_after_failed_trials` (3, not config-resolved).
max_consecutive_failures = 5
max_stale_s              = 30.0  # seconds before held last-good reading becomes NaN

[instruments.piezo]
driver  = "piezo"
port    = "COM16"
baud    = 115200
enabled = true

# "DEBUG" shows every driver message; "WARNING" suppresses info.
[logging]
level = "INFO"

# false if no USB webcam is attached: on Windows OpenCV's CAP_DSHOW backend
# blocks 500 ms–3 s probing the device even when absent.
[webcam]
enabled = true

[web]
port = 8052   # Dash server port; change if 8050 is already in use

[piezo]
enabled = true
channel      = "A"
frequency_hz = 500
sweep_on_s   = 2.0
sweep_rest_s = 3.0

[piezo.liquid_events]
enabled = true
settings_source = "liquid_event_profile"
channel_a = true
frequency_hz = 525
sweep_on_s = 2.0
sweep_rest_s = 3.0

# --- PCB electrode configurations ---
#
# spacing_mm = [step_x, step_y] is the centre-to-centre distance between adjacent
# electrodes. Electrode 1 is upper-left (most positive X, Y); labels advance
# row-wise with X decreasing across a row and Y decreasing across rows.
#
# DEPOSIT AREA — the area a cast film covers on one electrode, and the denominator
# of every thickness number. Resolved most-specific-first:
#   1. deposit_area_mm2  an explicit MEASURED area (mask, or an observed spread).
#   2. well_diameter_mm  the well confining the cast. THE NORMAL ONE.
#   3. electrode_L_cm x electrode_w_cm x 100 — a weak fallback, kept only so a
#      board declaring nothing behaves as it always has. SUSPECT IT: those two are
#      the electrode GAP and stripe LENGTH (see [eis.cell]) — conduction geometry,
#      not a wetted footprint. On the 4-stripe board that is 4.0 mm2 against the
#      well's 18.7 mm2, a factor of 4.7 in every thickness derived from it.
# Measure the well and declare `well_diameter_mm` on any board you cast to.
# Thickness is UNAVAILABLE, never guessed, if a board declares none of the three.
[pcb.SoftAE_IDE_EIS]
channels        = 16
grid            = [4, 4]
spacing_mm      = [15, 15]     # 15 mm between adjacent electrodes
electrode_L_cm  = 0.2
electrode_w_cm  = 0.2
well_capacity_uL = 50          # per-electrode max eluted volume (elution budget)
cast_confinement = "sessile"   # NO WELLS here: free droplets on a flat surface, so
                               # wetted area is an OBSERVATION, not a geometry, and
                               # thickness is UNAVAILABLE on this board.
# deposit_area_mm2 =           # set from a MEASURED droplet footprint to re-enable
                               # thickness here; volume-dependent, so valid only
                               # over the dispense range it was measured at.

[pcb.SoftAE_EIS_4Stripe]
channels        = 32
grid            = [8, 4]
spacing_mm      = [10, 10]     # 10 mm between adjacent electrodes
electrode_L_cm  = 0.2
electrode_w_cm  = 0.2
cast_confinement = "well"      # wells are glued ABOVE the board, so depth is a
                               # wall-stack property, measured on-site.
well_diameter_mm = 4.88        # measured -> 18.7038 mm2 deposit area (pi d^2/4)
well_depth_mm    = 6.35        # measured -> 118.769 uL VOID volume (area x depth)

# Bead height (mm) the brim may carry ABOVE a full well. PTFE walls pin the contact
# line at the brim, so fluid stands proud instead of spilling and that head is real
# capacity. Bands (core/geometry.classify_fill): <= void fits; void..permitted is
# ABOVE BRIM and warns; > permitted STOPS.
#
# Bead volumes for this well (r = 2.44 mm), V = pi h (3 r^2 + h^2) / 6:
#   h = 0.25 mm ->   2.35 uL  (total 121.1,  +2.0 %)
#   h = 0.50 mm ->   4.74 uL  (total 123.5,  +4.0 %)
#   h = 1.00 mm ->   9.88 uL  (total 128.6,  +8.3 %)
#   h = 1.50 mm ->  15.79 uL  (total 134.6, +13.3 %)
#   h = 2.44 mm ->  30.42 uL  (total 149.2, +25.6 %)  <- HEMISPHERE: a bound, not a
#                                                        target; a bead depins first
#
# 0.0 = the brim is the limit. Raise it deliberately: the bead must also survive
# stage motion and the dispenser's approach, which this number knows nothing about.
permitted_overfill_mm = 0.0

# well_capacity_uL             # DERIVED here as void + permitted bead. Declare it
                               # only to impose a working margin; an explicit value
                               # wins, and one above the void is an overflow guard
                               # permitting more than the walls hold.

# --- Deposition twin (core/deposition.py) ---
#
# evaporation_pct: carrier fraction assumed to evaporate after a cast. 100 % is
# deliberate — it makes DRY thickness deterministic without a per-solvent
# volatility model, which is what lets a dry-basis ThicknessTarget reduce to a
# deposited-volume target. Lower it only alongside a real solvent model.
# permitted_overfill_mm: fallback bead height for boards declaring none of their
# own; a board's own key always wins, the wall material being a per-board property.
[deposition]
evaporation_pct = 100.0
permitted_overfill_mm = 0.0

# --- EIS measurement presets ---
#
# Every grid is tuned to stay OFF 60 Hz and its harmonics. `npts` sets the grid
# ratio and slides every interior point; `f_lo` sets the ladder's phase. Neither
# alone can land the comb in the gaps.
#
# `f_lo_mHz` is INTEGER mHz — `EISParams` coerces with int() and the instrument
# script emits `meas_loop_eis ... {f_lo}m` (minimum 16).
#
# EDITING ANY PRESET RETIRES ITS STOPWATCH ANCHOR: `preflight.EIS_ANCHOR_GRIDS` is
# keyed to these exact grids, so duration provenance falls back to "extrapolated"
# on its own, with no list to remember to update.
#
# `f_lo` is a CONDUCTIVITY floor in disguise — the -Z'' apex sits at
# f = 1/(2 pi R C_cell) and C_cell is a board property, so
# sigma_min = 2 pi f_lo C_cell L / (t w) (core/eis_scripts.sigma_floor_S_per_cm).
# Raise a floor and arcs truncate; R1 is then extrapolated and systematically high.
[eis_presets.Standard]
npts   = 34
f_hi   = 200_000
f_lo_mHz = 3_912
mv_ac  = 10

# DEFAULT_PRESET, and what equilibration runs use, so its floor is the system's
# default reach: ~1.9e-7 S/cm, about a decade below anything this rig has measured.
[eis_presets.Quick]
npts   = 27
f_hi   = 200_000
f_lo_mHz = 6_475
mv_ac  = 10

# Extended buys harmonic clearance with points, not time (~5 % more wall-clock),
# and the extra points improve fit conditioning.
[eis_presets.Extended]
npts   = 53
f_hi   = 200_000
f_lo_mHz = 1_351
mv_ac  = 10

[eis_presets.Longest]
npts   = 39
f_hi   = 200_000
f_lo_mHz = 228
mv_ac  = 10

# --- Channel-to-Pico routing ---
[channel_routing]
pico1_range = [1, 16]     # 1-based channel numbers routed to pico1
pico2_range = [17, 32]    # 1-based channel numbers routed to pico2

# --- Safety limits ---
#
# temp_max_C / temp_min_C are rig-wide setpoint limits, combined with the
# per-instrument max_temp/min_temp under [instruments.temp_controller] by taking
# the NARROWER window — highest floor, lowest ceiling. Either source can tighten
# the limit; neither can loosen it. A controller rated to 150 C stays at 150.
[safety]
temp_max_C     = 200.0
temp_min_C     = 5.0
pump_rate_max  = 2120.0     # µL/min for 14.4 mm syringe
pump_rate_min  = 0.05
# Stock interlock (core/reservoir.py). Soft warn alerts and keeps running; hard
# stop REFUSES the dispense, because a dry syringe drives the plunger into its
# mechanical stop. Levels are declared by the operator via Refill — never from
# single_pump's `res_vol`, which is only firmware padding, not real stock.
reservoir_soft_warn_uL = 1000.0
reservoir_hard_stop_uL = 250.0

# Stage travel limits and the per-step ceiling (core/dropcast.py,
# workflows/workflow_executor.py). `step_timeout_s` bounds any step declaring no
# `timeout_s` of its own — an unbounded step is indistinguishable from a hung
# instrument and no gate fires. Steps that legitimately run for hours declare
# their own (the anneal hold does). 0 = unbounded.
step_timeout_s = 900
stage_x_min_mm = -100.0
stage_x_max_mm = 100.0
stage_y_min_mm = -50.0
stage_y_max_mm = 50.0

# Anneal hold watchdog (drivers/contracts.monitored_hold). An unwatched multi-hour
# hold turns a drifting or dead heater into a wrongly-annealed sample that is then
# measured and recorded as valid. Beyond warn is reported; beyond fault
# CONTINUOUSLY for the grace period aborts the hold (a momentary excursion resets
# the timer). Bands come from measured ripple (within 1 C): warn 2x, fault 5x.
anneal_deviation_warn_C  = 2.0
anneal_deviation_fault_C = 5.0
anneal_deviation_grace_s = 120.0
anneal_poll_interval_s   = 30.0

# RH hold watchdog (drivers/contracts.classify_rh_hold). The anneal watchdog guards
# temperature only and `validate_rh_setpoint` caps humidity at write time and never
# looks again, so nothing else watches RH through a long hot hold. The failure mode
# is not drift — the loop is PID-controlled — but a PV sitting off command for hours.
#
# INSIDE A TEMPERATURE HOLD NO HUMIDITY VERDICT STOPS ANYTHING: both bands ALERT AND
# KEEP HOLDING (warn WARNING, fault CRITICAL), with the verdict carried on the hold
# report. Temperature stays blocking. Bands are SYMMETRIC, warn nested inside fault,
# and fault_pct is an OPERATOR JUDGEMENT about what is worth waking someone for, not
# a value fitted to any run.
#
# The ordinary hot approach (85 C, SP 15) reaches the fault band for ~25 min while it
# descends. That alert is correct and accepted: do NOT lengthen grace_s to suppress
# it, which would equally blind the watchdog to a real eight-hour excursion. grace_s
# is long on purpose — a short grace produces alerts an operator learns to ignore.
rh_deviation_warn_pct    = 3.0      # sustained |PV-SP| worth saying out loud
rh_deviation_fault_pct   = 5.0      # sustained |PV-SP| worth waking someone for
rh_deviation_grace_s     = 600.0    # long: the loop is slow and a hold is hours
rh_poll_interval_s       = 60.0

# Equilibrate/settle side (workflows/equilibration.py) takes the OPPOSITE policy:
# there humidity IS the variable under test, so an unmet setpoint is the primary
# result. How many CONSECUTIVE settle phases may end RH-decided (ceiling-limited, or
# unevaluable because RH was unreadable) before the campaign parks. Matches
# `AutonomousLoop.park_after_failed_trials` = 3 deliberately.
rh_ceiling_park_after_trials = 3

# --- Anti-clog purge (core/purge.py) ---
#
# A line carrying particulate stock has a check valve that clogs when the stock sits
# stagnant, on a ~10-minute timescale; being mid-run is not protection.
#
# `enabled` = the schedule is live and its consumption counts toward the stock and
# waste runway. `actuate` = fluid actually moves. Separate on purpose, and `actuate`
# ships OFF: purging is the only mechanism here that moves hardware with nobody
# asking it to, so it stays inert until someone arms it at the bench. enabled with
# actuate off logs each due purge as a dry run while the projection still bills the
# consumption, so the runway is not flattered.
#
# `interval_s` is a FLOOR, not a deadline: during a run a purge is queued to the next
# safe boundary rather than interrupting a cast.
[purge]
enabled           = true
actuate           = false
interval_s        = 900.0    # 15 min
particulate_uL    = 20.0     # per purge, on a particulate line
other_uL          = 10.0     # per purge, on every other line
# Which lines carry particulates and so take the larger volume; all channels purge
# together so non-purging lines do not become the new stagnation site. Pump 1 is NOT
# in `precondition_flush`'s `plug_ids` (0 and 2), so it moves only when its own
# component is non-zero — which is why a trial zeroing that component leaves the line
# stagnating. If `plug_ids` is retuned, re-check this pairing: a particulate line that
# is also a plug line would be credited every flush and never come due.
particulate_pumps = [1]
pumps             = [0, 1, 2]

# Waste container (core/consumables.py). Leave `waste_capacity_uL` unset to track the
# level without enforcing it — undeclared is *unknown*, never full.
# waste_capacity_uL  = 50000.0   # declare a real capacity to enforce a ceiling
waste_warn_fraction = 0.8

# --- Optimizer proposal selection ---
#
# SITE defaults for `BayesianOptimizer`; a campaign spec's field of the same name
# overrides per campaign, and `build_optimizer` is the one place either is read. The
# shipped values are a strict argmax that draws nothing from the RNG, so resume
# behaviour is unchanged while both are off.
[optimizer]
# Relative tolerance on the acquisition argmax. 0.0 = strict argmax. Above 0, the
# proposal is drawn uniformly (from the optimizer's checkpointed RNG, so it stays
# resume-safe) among candidates within `rtol` of the best — guarding flat surfaces
# where a strict argmax returns whichever index numpy saw first.
decision_rtol = 0.0
# Normalized-space exclusion radius around measured points; commented out = off, the
# shipped behaviour. When set, nearer candidates are excluded from the argmax,
# preventing near-duplicate re-requests. If EVERY candidate is excluded the
# unexcluded argmax is used and a warning logged, rather than failing the campaign.
# exclusion_radius = 0.05

# --- Failure-informed feasibility ---
#
# A CLASSIFICATION surrogate fit on pass/fail labels, softening the acquisition while
# the regression GP still sees only real measurements. NULL-objective discipline is
# unchanged: `unmeasured` is not `infeasible`, and infeasible stays a strict subset of
# the NULL rows. `enabled = false` is shipped and the feature NEVER turns itself on,
# not even after N failures — the same posture as [quality] enabled and [purge]
# actuate. Off means the proposal stream is bit-identical to a build without it.
[feasibility]
enabled = false
# "fwa" (acquisition x p_feas) is the only implemented strategy. "fia" is DEFERRED
# behind a named trigger (>= 100 labelled trials in one space) and "fca" is REJECTED
# — softae argmaxes a random candidate pool, so there is no constrained optimizer to
# hand a constraint to. Naming either RAISES rather than silently running "fwa".
strategy = "fwa"
# Cap the reward side of p_feas so a confidently-safe point earns no bonus and the
# weight acts purely as a penalty. The clamp's VALUE is never set here — it is derived
# as 0.05^(1/min_infeasible), so the threshold tracks the evidence actually held.
min_filter = true
# Minimum labels of each class before the classifier may move anything; below either
# floor p_feas is 1.0 everywhere. TUNABLE UPWARD ONLY — nothing may lower these. Below
# 3 the derived clamp exceeds 0.63 and the weight would penalise points the classifier
# thinks MORE likely feasible, so a lower value is refused with an error naming the floor.
min_infeasible = 3
min_feasible = 3

# --- Measurement quality gate (P4) ---
#
# Decides whether a measurement is trustworthy enough to steer the optimizer. A reject
# is reported as *unmeasured*: the well is still recorded as cast, but nothing is told
# to the optimizer. `enabled = false` runs every check and logs what it WOULD have
# rejected without acting — observe that log against real data before arming.
[quality]
enabled          = false
min_r_squared    = 0.95    # below this, the fit does not describe the data
max_residual_pct = 15.0    # RMS residual ceiling (%)
min_points       = 8       # too few points to support a 5-parameter fit
min_abs_z        = 1e-3    # |Z| at/below this = shorted or dead channel
# "Is this an open circuit?" — deliberately NOT the same number as
# [eis.instrument] z_max_ohm, which answers "is this reproducible?".
max_abs_z        = 1e12    # |Z| at/above this = open circuit

# --- EIS analysis engine (docs/EIS_GATE_FRAMEWORK.md) ---
#
# Two engines. "legacy" fits R0-CPE0-p(R1,C0), takes R1, divides. "gated" adds
# admission gates, a per-sample cell constant, and upper bounds where the measurement
# is resolution-limited.
#
# CURRENT STATE: engine = "gated" since 2026-09-09, on the operator's ruling. The two
# flags that let a gate ACT on data both stay false — `[eis.gates] enabled` and
# `[quality] enabled` — so nothing is discarded: a would-be REJECT is logged as
# `eis_gate_would_reject` and recorded SUSPECT. Reverting is this one key.
#
# POINTS ARE STILL DROPPED WITH THE GATES "OFF": `run_gates` applies every
# `block_point` mask regardless of `[eis.gates] enabled`, which only guards the REJECT
# short-circuit. So the engine choice does move numbers. `engine` and `gates.enabled`
# stay separate on purpose — the same two-flag design [purge] and [eis.scout] use.
#
# ATTRIBUTABLE AND REVERSIBLE: `fit_results.engine` is written from the report's own
# engine, not from this key, so every row is separable from the legacy rows before it
# — as are `gate_verdict`, `gate_log_json`, `n_points_used`, `n_points_dropped`.
#
# TRUNCATION CAVEAT: `kk_truncation` can remove low-frequency points before the fit;
# where the bulk arc sits at the bottom of the band that removes the arc itself and R1
# lands on a mid-band feature (~200x low, hence ~200x in sigma). Goodness-of-fit RISES
# in those cases, so R^2 must NOT be read as confirmation.
#
# ACTIVE DEFECT, KNOWN AND UNFIXED: with `[eis.gates] enabled = false`, a spectrum the
# gates leave with ZERO surviving points sends the empty set to the fitter and
# `analyze_spectrum` RAISES ValueError out of `extract_features`. Four callers do not
# absorb it: `tab_analysis` (x2), `tab_experiment`, `eis_visualizer_widget`.
[eis]
engine = "gated"           # "legacy" | "gated"

# What a campaign optimises against. `engine` chooses WHICH PHYSICS computes sigma (one
# sigma everywhere, resolved in `analyze_spectrum` alone); `objective` chooses WHICH
# METRIC a campaign is scored on. The two modes want different metrics, neither degraded:
#   composition mode  a formulation is declared, so the twin predicts a thickness
#                     -> CONDUCTIVITY, maximised.
#   volume mode       raw pump volumes; without stock identity there is no dry thickness,
#                     so sigma is impossible rather than missing -> MEAN |Z|, minimised.
# "auto" follows the mode; "sigma" forces conductivity (a campaign that cannot deliver it
# is refused); "mean_abs_z" forces impedance. A pinned value is NEVER silently swapped:
# the two are optimised in OPPOSITE directions, so substituting one inverts the search —
# which is why the direction is derived, not configured.
objective = "auto"         # "auto" | "sigma" | "mean_abs_z"

# Function-evaluation budget for the LEGACY fitter (analysis/circuit_fitting.fit_circuit).
# Without it the fitter inherits impedance.py's maxfev = 1e5 at ftol = 1e-13 and the
# GUI's Analysis/Arrhenius fit looks hung, because for roughly one spectrum in 54 it is.
# A CAP CANNOT DEGRADE A NUMBER SILENTLY: `curve_fit` RAISES on budget exhaustion and
# never returns a best-so-far, so a cap either does not fire (bit-identical fit) or the
# fit fails as it was already going to. Kept equal to [eis.pregate] max_nfev so the
# codebase carries one answer to "how long may a fit run". 0 or negative = NO CAP (the
# kwarg is omitted entirely, not set to a large number standing in for "off").
legacy_max_nfev = 2000

[eis.gates]
# false = observe only: `policy.reduce_gates` downgrades a would-be REJECT to SUSPECT.
# Point-blocking masks still apply — see the note under [eis] above.
enabled             = false
# Engineering defaults from the specification, uncalibrated against this rig, EXCEPT
# `kk_resid_pct` and `kk_c`, which were measured here and moved off the printed values.
tand_slope_max      = -0.3   # d log tanδ/d log f; positive => series parasitic
cap_flatness_max    = 0.15   # |d log C_app/d log f| before "dispersive"
kk_resid_pct        = 3.0    # lin-KK residual ceiling. The rig's per-point noise floor
                             # is ~3 % by two independent estimators, so a tighter value
                             # asks the gate to resolve drift finer than the measurement.
kk_c                = 0.30   # mu-criterion floor for the Voigt ladder — NOT Schoenleber's
                             # 0.85, which stops the ladder early and leaves a systematic
                             # residual on a noise-free, exactly causal spectrum. The
                             # durable half of that fix is the order-selection rule in
                             # analysis/eis/kk.py, not this number.
kk_max_M            = 50     # mu <= kk_c filters candidate orders rather than stopping
                             # the walk, which exits only after 3 consecutive orders under
                             # the floor; the selected rung has the minimum median residual.
                             # Costs ~0.5-1.0 s per 53-point spectrum (+16-32 s per
                             # 32-channel round). Lower it to buy that back, at the price
                             # of ladder flexibility.
# Largest band fraction the low-f K-K truncation may remove before the spectrum is
# REJECTED instead of cut. The ladder fit is global, so drift in a few low-f points
# shifts the whole fit and fails almost every point; unbounded truncation would delete
# the spectrum while reporting it had tidied a tail. Cutting is licensed only because
# R_bulk does not live at low f — once the failure reaches that far up, the premise is gone.
kk_max_truncate_frac = 0.5
plateau_tol_pct     = 10.0   # how close Re Z must sit to the plateau median
min_fit_pts         = 8      # below this a spectrum cannot support a fit
max_rel_se          = 0.10   # parameter relative standard error
rho_degenerate      = -0.95  # below this, report R_series+R_bulk, not the split
bound_tol           = 1e-3   # fractional distance to a bound counted as pegged
plateau_min_decades = 0.5    # narrower than this and R_bulk is extrapolated
tand_headroom_mult  = 3.0    # tanδ must exceed this × the phase floor for a value
blank_over_frac     = 0.35   # open blank unusable above this fraction over range
blank_flip_frac     = 0.30   # ...or this density of Im sign flips
blank_repro_pct     = 5.0    # blank repeatability tolerance

# Geometry series (E5): the two keys below are [eis.gates] keys — there is no separate
# section — read by the geometry-series fitter. sigma comes from the SLOPE of Re(Y)
# against thickness; a DC-like ionic conductance gives a slope that does not move with
# frequency, while residual dielectric loss scales ~ omega, so a contaminated slope
# drifts WHILE fitting a straight line at every individual frequency — per-frequency R^2
# is no defence. When either trips, `fit_geometry_series` REFUSES sigma (NaN) rather than
# flagging it; the raw median is kept alongside so the refusal can be inspected.
geom_sigma_spread_tol   = 0.25  # max fractional spread in sigma across frequencies
geom_slope_exponent_tol = 0.15  # max |d ln m / d ln f|; loss trends to 1, sigma to 0

# --- Acquisition scout (analysis/eis/scout.py) ---
#
# Where the NEXT sweep should put its points, given the arc the last one found. A piecewise
# sweep around the observed apex roughly doubles arc coverage and is usually cheaper than a
# preset, which spends most of its time in a decade where nothing is being measured.
#
# `enabled` logs the plan it would have chosen (free: it stamps `eis_scout_verdict` on the
# row and takes no extra sweep). `actuate` lets that plan drive the next acquisition —
# separate exactly as `[eis.gates] enabled` is. BOTH SHIP OFF; leave `actuate` off until the
# logged verdicts have been reviewed, because actuating changes WHICH spectrum is acquired.
#
# Only one of three call sites can act: the Manual Control tab (its own checkbox,
# `actuate_manual`, not `actuate`; a second sweep can only ever be WIDER or denser, never
# narrower). The Temperature/RH sweep is OBSERVE-ONLY by construction — every script is
# written before `executor.run`, so a plan is stale by then (the apex moves ~100x across an
# RH change) — and the campaign path is out of scope for the same reason.
#
# NO PLAN OUTLIVES THE MEASUREMENT THAT MADE IT: a decision is consumed by the acquisition
# that produced it and discarded. Between two Run presses the sample, RH and temperature may
# all have moved, undetectably.
[eis.scout]
enabled                     = false
actuate                     = false

# The Manual Control tab's OWN switch, which `actuate` cannot reach. That tab is where
# uncharacterised samples get measured, and the planner assumes a SINGLE arc: `arc.py`
# reports the tallest interior maximum, so on a two-arc spectrum it picks one and plans
# around it without saying it chose. THIS KEY IS ONLY WHAT THE CHECKBOX STARTS AT; leave
# it false unless every sample that tab sees is a plain single-arc cell.
actuate_manual              = false

# The planner's OWN cut, deliberately NOT arc.py's: `arc_closure` is biased toward CLOSED
# because a missed warning is cheaper than a false one, whereas here a too-narrow sweep
# costs a well and a systematic R1 overestimate against tens of seconds for one preset
# step — so this sits well toward OPEN. Calibrate by replay against the stored corpus.
band_below_apex_min_decades = 1.0
apex_prominence_min         = 0.10   # topographic, relative to the peak's OWN height

# Segment layout. Points per DECADE, not a fixed arc point count: that is what the circle
# fit cares about and it keeps cost proportional to the band. `f_hi_hz`/`f_floor_hz` are
# not duplicated here — they resolve from [eis.instrument] f_max_hz / f_min_hz, the
# authority on this instrument. Costs are priced by core/preflight.py; a firmware exposing
# `eis_opt`/`meas_ms_eis` would invalidate that cost basis and require re-deriving these.
hf_points                   = 10     # HF limb; every point sits at the 0.131 s floor
arc_points_per_decade       = 12.0
arc_decades_above           = 1.0
arc_decades_below           = 1.0
tail_points                 = 0      # 0 omits the tail segment entirely
tail_decades                = 0.0
max_total_s                 = 0.0    # 0 = uncapped; else the arc band is trimmed in
                                     # 0.1-decade steps until it fits, logged with
                                     # requested vs granted

# --- Fitter pre-gate (E3) ---
#
# `arc_closure` knows in ~1 ms what the optimiser takes tens of seconds to discover. On
# steeply capacitive open arcs the covariance fit exhausts its budget and returns NOTHING —
# the R1 on the row came from the fallback fitter all along.
#
# NOT A SKIP-ON-OPEN, and it must never become one: refusing the open population would throw
# away most of the cold end of every temperature sweep, exactly where an Arrhenius slope has
# its leverage. Every spectrum still produces an R1; these flags only choose a cheaper route.
#
# TWO FLAGS, INDEPENDENT ON PURPOSE (a third lives in [eis.scout], choosing which
# frequencies are ACQUIRED):
#   budget_cap      how long the SAME estimator may run. Cannot move a number — a bounded
#                   run is a strict prefix of the unbounded trajectory, so a fit that was
#                   going to exhaust its budget fails and falls back identically.
#   two_point_open  WHICH estimator produces R1. DELIBERATELY CHANGES IT, on the open
#                   population only, so it is a SCHEMA EPOCH: rows either side compare only
#                   among themselves there, diverted rows are labelled `gated_two_point` in
#                   fit_results.engine, and nothing is backfilled.
# ARM THEM ONE AT A TIME: flip two together and a moved R1 has two candidate causes with no
# way to separate them. `PregateSettings` defaults both to False — not a contradiction, but
# the fallback for an unreadable config, which must not arm anything.
[eis.pregate]
budget_cap          = true
two_point_open      = false

# The discriminator is SEVERITY, not the verdict: `state == OPEN` alone is wrong, because a
# shallow open arc converges in ~0.05 s while steeply capacitive ones cost tens of seconds
# and return nothing. -60 deg sits in the empty band between those clusters. Deliberately
# NOT in arc.py, which keeps its CLOSED-biased verdict and ships no policy.
phase_low_max_deg   = -60.0

# Residual-evaluation ceiling for the capped fit: two orders below the fitter's
# DEFAULT_MAX_NFEV = 20 000 and an order above every fit measured to converge here, so it
# sits in the gap between "converges" and "never will". Kept equal to [eis] legacy_max_nfev.
max_nfev            = 2000

# --- Fixture correction ---
#
# How much of the measured impedance belongs to the mux, ribbon and trace rather than the
# cell. GATED engine only. `mode = "auto"` resolves from the calibration's capability
# ladder: "none" until a short blank exists for this fixture, "series" the moment one does
# — nobody has to remember to switch it on after commissioning, and nobody can forget to
# switch it off after a board swap, because a hardware_hash mismatch drops the constants
# first. SERIES ONLY, ON PURPOSE: open/short/load ("OSL") is NOT implemented and was
# recorded corrupting every spectrum on this fixture. The open blank is still worth
# measuring — an UNUSABLE open is positive evidence that shunt admittance is negligible,
# which is exactly when short-only series correction is exact — but it selects the
# fallback and is never applied, so `auto` never resolves to OSL.
[eis.fixture]
mode                = "auto"     # "auto" | "none" | "series"
fixture_id          = "mux16"    # which calibration/eis/<id>.toml to apply
load_tolerance_pct  = 5.0        # end-to-end load-blank error before distrust

# --- Measured envelope of THIS instrument ---
#
# From reference components with the reference electrode correctly connected. There is no
# "phase-reliable ceiling" separate from the magnitude one: an earlier `z_phi_ohm = 5e7`
# was an artifact of a FLOATING reference electrode, is RETRACTED, and nothing gates on
# one. Consequence, reversing earlier guidance: sigma_min scales WITH frequency, so LOW
# frequency is strongly favoured. CAVEAT — phase noise was measured on a RESISTIVE load at
# 1e4 Ohm while films sit at 1e6-1e8 Ohm and are capacitive, so outside
# `phase_noise_valid_decades` of `phase_noise_at_ohm` a bound is reported as *provisional*
# rather than qualified. The E2 calibration module supersedes this block where one exists.
[eis.instrument]
f_min_hz           = 0.016
f_max_hz           = 200_000
f_verified_lo_hz   = 1.2      # no degradation observed down to here at 1e4 Ohm
z_min_ohm          = 10
z_max_ohm          = 144560987.92693862  # PHASE-VERIFIED ceiling (1.4456e8): the highest
                              # |Z| at which the phase floor was actually measured. NOT the
                              # datasheet 1e9 (a hard limit and a verified range are
                              # different things) and NOT the observed rail 1.0147e9, which
                              # is the artefact that should be gated out, not the bound.
                              # MIRRORS calibration/eis/mux16.toml, the derived record;
                              # this block is the fallback until CalibrationSet.envelope()
                              # is wired. KEEP THE TWO IN STEP BY HAND until then.
phase_noise_deg    = 0.149    # measured, 9.9 kOhm resistive -> tan d floor 0.0026
phase_noise_at_ohm = 9.9e3    # the impedance it was measured at
phase_noise_valid_decades = 1.0   # how far it may be trusted either side
phase_noise_load   = "resistive"
magnitude_accuracy_pct = 0.32 # measured, flat across 5 decades of f
# Fixture stray capacitance, TWO-ELECTRODE (RE tied to CE) on the multichannel fixture, and
# a BOARD MEDIAN, NOT A CHANNEL: tied open blanks span 10.2-24.7 pF across nominally
# identical stripes yet repeat to 1 % each, so the spread is REAL per-channel variation.
# Prefer a per-channel CalibrationSet where one exists — taking the lowest channel as the
# fallback understates Z_phi and over-reports how many sigma values are values rather than
# bounds. Cable-dominated, not mux-dominated, so the multichannel number belongs here: it is
# the path samples are measured through. A three-electrode figure for a two-terminal load is
# a floating-divider artifact and must not be used.
stray_C_instrument_F = 18.5e-12   # multichannel fixture, 2-electrode, board median
c_cell_F           = 1.0e-9   # board/cell shunt C — NOT the instrument path
phase_noise_measured = true
magnitude_window_measured = false
measured_at        = "2026-08-05"

# Largest excitation amplitude shown NOT to saturate the current range. At 100 mV the |Z|
# ratio deviated up to 2.3x, peaking at the impedance MINIMUM where current is largest —
# that is current-range saturation, not interfacial nonlinearity, so the remedy is a HIGHER
# CURRENT RANGE, not less voltage. The deployed MethodSCRIPT runs 15 mV, safely under this.
max_amplitude_mV   = 25.0

# --- Cell geometry ---
#
# L_gap and L_stripe are the two numbers [pcb.*] calls electrode_L_cm and electrode_w_cm,
# named for what they physically are: the electrode gap and the stripe length, for lateral
# conduction across the gap. K = L_gap / ((t - h) * L_stripe), so at h = 0 this is
# arithmetically identical to the legacy sigma = L/(R*t*w) and no stored number moves.
# `dead_height_um` ships at 0: a value near 48 um has been suggested, but from thickness
# levels perfectly confounded with channel and with 1.3-2.1x replicate scatter, trusted to
# no better than ±20 um. A geometry series can fit it (E5); it is not applied until one does.
[eis.cell]
geometry         = "coplanar"
blocking         = true
L_gap_cm         = 0.2
L_stripe_cm      = 0.2
dead_height_um   = 0.0
thickness_max_cm = 0.05    # 500 um; above this a "thickness" is a placeholder

# Electrode sensing configuration. With WE and CE identical stripes and RE exactly mid-gap,
# mirror antisymmetry gives Z_3-electrode = 1/2 * Z_2-electrode exactly at every frequency,
# so the full-gap K over-reports sigma by that factor and sigma = K_geom/(k_config_factor*R).
# The rig is wired THREE-ELECTRODE permanently (operator decision: other electrochemical
# techniques need it). That is a WIRING FACT, and recording it does NOT arm the correction:
# the factor of 2 is contingent on stripe symmetry and RE centring, neither measured on this
# board, so `k_config_verified` stays false and `k_config_factor` stays 1.0 — an outstanding
# precondition, not a measurement contradicting the value. To arm it, measure both, then set
# `k_config_verified = true` (uses 2.0, the symmetry value) or pin a measured ratio in
# `k_config_factor` (an explicit override wins over both). Until then absolute sigma reports
# as "scale unqualified"; RELATIVE trends are unaffected, the factor being constant across a
# series, so campaigns ranking formulations are valid now.
electrode_configuration = "3-electrode"  # "3-electrode" | "2-electrode" | "unverified"
k_config_verified       = false          # true => apply the configuration's factor
# k_config_factor       = 2.0            # explicit override (wins over the above)

# k_config_verified = true is NECESSARY BUT NOT SUFFICIENT, and the absence of a
# `re_contact_verified` key here is the point. The symmetry derivation assumes the RE senses
# a real potential in a CONDUCTING MEDIUM, which holds only where the cast film makes an
# ionic path to the reference stripe. Where it does not — blanks, reference components, dry
# or dewetted films — the RE floats onto a load-dependent capacitive divider, not
# reproducible even at fixed load, and there is no factor to apply at all. Contact is
# therefore a property of each SAMPLE, not of the board; a key here would assert it for every
# sample cast, including exactly the population where it fails. It is passed per measurement:
#     cell_constant_for_sample(..., re_contact_verified=True,
#                              re_connection="bridged_by_sample")
# Unsupplied means not verified, demoting k_config_factor to 1.0 on a three-electrode board.
# Fail-closed costs a known 2x; fail-open an unknown one.

# --- Liquid handling correction (optional) ---

[liquid_handling]
enabled = false
beta = 0.3
eta_ref_mpas = 1.0
alpha_growth_per_run = 0.0

[liquid_handling.pump_line]
0 = 0
1 = 1

[liquid_handling.line.0]
cracking_kpa_per_valve = 8.0
compliance_uL_per_kpa = 0.55
alpha_base = 0.2
viscosity_mpas = 1.0

[liquid_handling.line.1]
cracking_kpa_per_valve = 8.0
compliance_uL_per_kpa = 0.55
alpha_base = 0.2
viscosity_mpas = 1.0

[liquid_handling.line.2]
alpha_base = 0.2
viscosity_mpas = 1.0
cracking_kpa_per_valve = 8.0
compliance_uL_per_kpa = 0.55

[stage_calibration]
home_x = 0.0
home_y = 0.0
dep1_x = 43.5
dep1_y = 50.0
flush_x = -50.0
flush_y = 50.0
wick_x = -50.0
wick_y = -25.0

# Two-phase cast (precondition flush -> deposition) defaults for the HT/AE tabs. Per-pump
# rates are split proportionally to per-pump volume so all components extrude for the same
# duration. Positions / plug settings / dwell live on the catalog methods
# (startup_flush_full, precondition_flush, single_drop_simul), so Process Studio remains
# the place to iterate on elution accuracy.
[dropcast]
dispense_rate_uL_min   = 200.0     # total deposition flow rate (split per pump)
line_flush_rate_uL_min = 1500.0     # total flush flow rate (start + precondition)
flush_factor           = 2.0       # precondition preload = deposition vol x factor
settle_factor          = 2.0       # deposition settle wait = duration x factor
settle_base_s          = 30.0       # fixed floor added to the derived settle wait
start_flush_uL         = [200.0, 100.0, 100.0]   # per-pump start-flush volumes
default_recipe = "two_phase"
