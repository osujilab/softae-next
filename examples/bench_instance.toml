# ─────────────────────────────────────────────────────────────────────────────
# Bench instance — ONE fully-specified recipe, cast four times.
#
#   softae-campaign check examples/bench_instance.toml
#   softae-campaign run   examples/bench_instance.toml --head-up --yes \
#       --project <project>
#
# THIS IS THE PINNED-RECIPE SHAPE, AND IT NEEDS NO NEW MACHINERY.
# Every `[[general_formulation.axes]]` below has `low == high`, which is what
# `CompositionAxis` means by *pinned* (its own docstring, composition_axes.py):
# `axes_parameter_space` omits a pinned axis and `build_targets_from_axes`
# substitutes the constant, so the optimizer is never handed a degenerate
# dimension and the suggestion cannot perturb the recipe.
#
# What makes it run FOUR times is the one honest search dimension:
# `[parameter_space.replicate]`, an `int` 1..budget under `optimizer = "grid"`.
# Grid turns an int axis into `min(n_points, high - low + 1)` points and
# `n_points` is the campaign budget, so it yields exactly `budget` suggestions
# and then `None`. `replicate` names a fact that genuinely varies across the
# four wells — which well — and lands in the DOE row, so the DataStore records
# a replicate set rather than four rows that merely look identical.
#
# A degenerate FLOAT parameter would be refused at both gates (`low >= high`),
# and an empty `parameter_space` is refused by the loader. The int replicate
# axis is the shape that is legal *and* says what it is.
#
# THE `[[run_plan.phases]]` BLOCK AT THE BOTTOM IS WHAT MAKES THIS AN INSTANCE
# RATHER THAN A CAST. Until `campaign_spec_run_plan.py` existed the loader
# refused `run_plan` outright, so this file ran the engine's pointwise layout —
# per-channel deposit + EIS, no anneal and no equilibrate phase at all. It now
# says the whole arc: cast four wells, cure the plate once, hold until the
# measurement stops moving, then read.
# ─────────────────────────────────────────────────────────────────────────────

name     = "bench_instance_pinned"
pcb_name = "SoftAE_EIS_4Stripe"

# Direction is DERIVED, never stated. This is composition mode, so the objective
# resolves to conductivity and `objective = "auto"` maximises it. Writing an
# explicit direction that disagrees is refused rather than preferred.
objective = "auto"

# Deterministic by construction: grid walks its points in order, and every point
# maps to the same recipe anyway. `seed` is irrelevant here and left at default.
optimizer = "grid"

# Four wells, four suggestions, one physical run: `batch = true` casts one
# suggestion per channel in a single round rather than replicating one
# suggestion across all four. With a pinned recipe both produce identical
# volumes; batch is chosen so each well is scored against its OWN spectrum.
channels = [1, 2, 3, 4]
batch    = true
budget   = 4

# EVERY top-level key must stay ABOVE the first `[table]` header: TOML assigns a
# bare key to the most recently opened table, so a key written below
# `[parameter_space.replicate]` silently becomes a *parameter attribute*.

# The only searched dimension, and it is not a composition target. `high` must
# equal `budget`: grid emits `high - low + 1` int points, so a smaller `high`
# exhausts early and a larger one is truncated to `budget` by `n_points`.
[parameter_space.replicate]
type = "int"
low  = 1
high = 4

# ── The recipe, pinned ───────────────────────────────────────────────────────
#
# Stock names resolve against the shared solution catalog (the same CSVs the
# deposition twin and the consumables ledger read) — a name the catalog does not
# know is refused at load, since the solver cannot turn a target into volumes.
#
# `pump_assignment` puts the silica on pump 1 because `[dropcast]
# particulate_pumps = [1]` in softae_config.toml: pump 1 is the line with the
# anti-clog purge window, and the silica sol is the particulate stock.
#
# `target_deposition_uL` is the DRIED-film volume. At 4.5 µL this recipe solves
# to ~97 µL of wet cast against the 4-stripe well's ~118.8 µL capacity — inside
# the well with headroom. It scales close to linearly, so raising it much past 5
# overflows; `budget_uL` below is the hard stop that turns an overflow into a
# refusal (`FormulationInfeasibleError`) instead of a spill.
[general_formulation]
stocks               = ["5wt% 20k PEO stock", "10 wt% silica solution", "LiCl 10M"]
target_deposition_uL = 4.5
budget_uL            = 118.0

[general_formulation.pump_assignment]
"5wt% 20k PEO stock"     = 0
"10 wt% silica solution" = 1
"LiCl 10M"               = 2

# PINNED: EO:Li = 20 exactly. `low == high` is the pinning, and every key is
# written out because an omitted one would silently take a default and search a
# different composition.
[[general_formulation.axes]]
kind  = "molar_ratio"
a     = "Ethylene oxide"
b     = "Lithium chloride"
low   = 20.0
high  = 20.0
basis = "volume"

# PINNED: 10 % silica by dried volume.
[[general_formulation.axes]]
kind  = "dried_fraction"
a     = "Fumed silica"
b     = ""
low   = 0.10
high  = 0.10
basis = "volume"

[measurement]
modality = "eis"
enabled  = true

# `Extended` reaches 1.2 Hz — `[eis.instrument] f_verified_lo_hz`, the lowest
# frequency this instrument has been shown to hold at 1e4 Ω. `Quick` bottoms out
# at 20 Hz, which is not enough band for the gated engine to judge a film.
preset = "Extended"

# ── The run plan: cast all four, cure once, settle, then read ────────────────
#
# `scope` is written on EVERY phase and is never inferred — not from `batch`,
# not from the kind. `per_sample` does the phase to each well as it is cast;
# `per_batch` does it to the whole plate at once. Those are different physical
# processes, and a guess here would silently run the one nobody wrote down.
#
# FORMULATE is always `per_sample` (`RunPlan.__post_init__` refuses anything
# else — each sample is cast individually), and the engine runs the whole
# per-sample segment before opening the per-batch block. That is what makes
# this "cast every sample, then anneal once" rather than four cure cycles.

[[run_plan.phases]]
kind  = "formulate"
scope = "per_sample"
  # Casting environment. An omitted axis is an axis NOT DRIVEN — there is no
  # other way to say it in TOML — so both are written here deliberately.
  [run_plan.phases.conditions]
  name            = "casting"
  temp_setpoint_C = 25.0
  rh_setpoint_pct = 40.0

[[run_plan.phases]]
kind  = "anneal"
scope = "per_batch"
# The cure DURATION lives only here, in the catalog task's name and params
# (`data/tasks.toml` → `anneal_85C_8h`: 85 °C, hold 28 800 s, timeout 29 400 s).
# The temperature below therefore states it a second time; which of the two is
# authoritative is the open question in `docs/SubAgent docs/anneal_phase_duration.md`,
# and nothing here anticipates that ruling.
anneal_task = "anneal_85C_8h"
  [run_plan.phases.conditions]
  name            = "anneal"
  temp_setpoint_C = 85.0
  # ~20 %RH is the attainable floor at 85 °C, not a choice: the flush basin
  # humidifies the enclosure as it warms, and a commanded 15 returned a PV of
  # 19.5–23.2. See `analysis/rh_floor.py`, whose own warning forbids fitting an
  # absolute threshold to this.
  rh_setpoint_pct = 20.0
  # 4 h, against the shipped 1 800 s default, and the honest number rather than
  # a hopeful one: `anneal_phase_duration.md` §4 measures the 85 °C descent at
  # ~0.0015 %RH/s, so reaching |PV − 20| ≤ 2 from 40 %RH is an 18 %RH descent
  # ≈ 12 000 s. 14 400 s is that plus ~20 % headroom. At the default this phase
  # would abort at the anneal boundary with four wet samples already cast —
  # `rh_wait` carries `raise_on_timeout`, and that refusal is the point.
  rh_approach_timeout_s = 14400.0

[[run_plan.phases]]
kind  = "equilibrate"
scope = "per_batch"
  # The three durations are REQUIRED and have no defaults: `min_hold_s` is the
  # cure tail and belongs to the recipe, `max_hold_s` is the ceiling that makes
  # the phase terminate at all, `round_period_s` is instrument time per sample.
  [run_plan.phases.settle]
  round_period_s = 240.0
  min_hold_s     = 1500.0
  max_hold_s     = 14400.0
  [run_plan.phases.conditions]
  name            = "equilibrate"
  temp_setpoint_C = 25.0
  rh_setpoint_pct = 50.0

[[run_plan.phases]]
kind  = "measure"
scope = "per_batch"
  # OPTIONAL. The production read is the authoritative measurement by its ROLE,
  # not by its parameters — it runs after settling either way. This block only
  # makes the acquisition denser than the campaign's own `[measurement]`.
  [run_plan.phases.measurement]
  preset = "Extended"
